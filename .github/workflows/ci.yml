name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linters (black/isort/mypy/flake8)
        # Not yet enforced; drop continue-on-error once the codebase is lint-clean
        continue-on-error: true
        run: |
          uv run black --check devsafe tests
          uv run isort --check --diff devsafe tests
          uv run mypy devsafe
          uv run flake8 devsafe tests

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Build sdist and wheel
        run: uv build

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="dist/devsafe-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the built version:"
            ls dist/
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release with wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DevSafe ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

# Users install straight from this repository (see INSTALL.md); tagged
# releases also get the built wheel and sdist attached. See RELEASING.md.
